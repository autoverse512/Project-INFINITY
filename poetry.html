<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Poetry & Writing — Infinity</title>

<link rel="stylesheet" href="poetry.css">
```

</head>

<body>

```
<!-- TOP BAR -->
<header class="editor-topbar">

    <button class="exit-button" onclick="window.location.href='creator.html'">
        ← Exit
    </button>

    <div class="top-controls">

        <button class="done-button" id="doneButton">
            Done
        </button>

        <button class="tool-button" id="colorButton">
            <span class="color-preview"></span>
            Colour
        </button>

        <button class="tool-button" id="fontButton">
            <span class="font-preview">Aa</span>
            Font
        </button>

    </div>

</header>


<!-- COLOUR MENU -->
<div class="tool-menu color-menu" id="colorMenu">

    <button class="color-option" data-color="#171717">
        <span class="color-dot black"></span>
        Black
    </button>

    <button class="color-option" data-color="#ffffff">
        <span class="color-dot white"></span>
        White
    </button>

    <button class="color-option" data-color="#665cff">
        <span class="color-dot purple"></span>
        Purple
    </button>

    <button class="color-option" data-color="#269bd7">
        <span class="color-dot blue"></span>
        Blue
    </button>

    <button class="color-option" data-color="#d94b5f">
        <span class="color-dot red"></span>
        Red
    </button>

    <button class="color-option" data-color="#278653">
        <span class="color-dot green"></span>
        Green
    </button>

    <button class="color-option" data-color="#c18a27">
        <span class="color-dot gold"></span>
        Gold
    </button>

</div>


<!-- FONT MENU -->
<div class="tool-menu font-menu" id="fontMenu">

    <button data-font="Georgia, serif">
        Classic
    </button>

    <button data-font="Arial, sans-serif">
        Modern
    </button>

    <button data-font="'Courier New', monospace">
        Typewriter
    </button>

    <button data-font="'Trebuchet MS', sans-serif">
        Clean
    </button>

    <button data-font="'Times New Roman', serif">
        Literary
    </button>

</div>


<!-- NOTEBOOK -->
<main class="notebook-wrapper">

    <section class="notebook">

        <!-- REAL NOTEBOOK MARGIN -->
        <div class="notebook-margin">
            <div class="margin-line line-one"></div>
            <div class="margin-line line-two"></div>
        </div>


        <!-- PAGE -->
        <div class="page-content">

            <input
                type="text"
                id="poemTitle"
                class="poem-title"
                placeholder="Write your title..."
                maxlength="120"
            >

            <div
                id="poemContent"
                class="poem-content"
                contenteditable="true"
                spellcheck="true"
                data-placeholder="Start writing..."
            ></div>

        </div>

    </section>

</main>


<script src="poetry.js"></script>
```

</body>

</html>
