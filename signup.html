<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — Infinity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">∞ INFINITY</a>

        <a href="index.html" class="nav-signup">
            Home
        </a>

    </nav>


    <main class="signup-page">

        <div class="signup-container">

            <div class="signup-header">

                <div class="signup-icon">∞</div>

                <span class="section-label">
                    JOIN INFINITY
                </span>

                <h1>
                    Create your<br>
                    <span>account.</span>
                </h1>

                <p>
                    Join the community and start bringing your
                    ideas to life.
                </p>

            </div>


            <form id="signup-form">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="nickname">Nickname</label>

                    <input
                        type="text"
                        id="nickname"
                        placeholder="What should we call you?"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="phone">Phone</label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Phone number"
                        >
                    </div>


                    <div class="form-group">
                        <label for="country">Country</label>

                        <input
                            type="text"
                            id="country"
                            placeholder="Country"
                        >
                    </div>

                </div>


                <button type="submit" class="button signup-submit">
                    Create Account
                </button>


                <p id="signup-message"></p>

            </form>


            <div class="login-link">
                Already have an account?
                <a href="#">Log in</a>
            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://ppsuunamsabnepjlcfyz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwc3V1bmFtc2FibmVwamxjZnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTk1NzgsImV4cCI6MjEwNDUzNTU3OH0.iua178hKtB6K7UbLFr1m2-SEpF9X7l8SErlULqOxHB0";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


        const form = document.getElementById("signup-form");
        const message = document.getElementById("signup-message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            message.textContent = "Creating your account...";


            const username =
                document.getElementById("username").value.trim();

            const nickname =
                document.getElementById("nickname").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const phone =
                document.getElementById("phone").value.trim();

            const country =
                document.getElementById("country").value.trim();


            // Create the authentication account
const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
        data: {
            username: username,
            nickname: nickname,
            phone: phone || null,
            country: country || null
        }
    }
});


            if (error) {

                message.textContent =
                    "Error: " + error.message;

                return;
            }


            // Save the profile information
            const { error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .insert({
                        id: data.user.id,
                        username: username,
                        nickname: nickname,
                        email: email,
                        phone: phone || null,
                        country: country || null
                    });


            if (profileError) {

                message.textContent =
                    "Account created, but profile could not be saved.";

                console.error(profileError);

                return;
            }


            message.textContent =
                "Account created successfully! 🎉";

            form.reset();

        });

    </script>

</body>
</html>
