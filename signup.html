<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — Infinity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            ∞ INFINITY
        </a>

        <a href="index.html" class="nav-signup">
            Home
        </a>

    </nav>


    <!-- SIGN UP -->
    <main class="signup-page">

        <div class="signup-container">

            <!-- HEADER -->
            <div class="signup-header">

                <div class="signup-icon">
                    ∞
                </div>

                <span class="section-label">
                    JOIN INFINITY
                </span>

                <h1>
                    Create your<br>
                    <span>account.</span>
                </h1>

                <p>
                    Join the community and start bringing your
                    ideas to life.
                </p>

            </div>


            <!-- FORM -->
            <form id="signup-form">

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- NICKNAME -->
                <div class="form-group">

                    <label for="nickname">
                        Nickname
                    </label>

                    <input
                        type="text"
                        id="nickname"
                        placeholder="What should we call you?"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- PHONE + COUNTRY -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Phone number"
                        >

                    </div>


                    <div class="form-group">

                        <label for="country">
                            Country
                        </label>

                        <input
                            type="text"
                            id="country"
                            placeholder="Country"
                        >

                    </div>

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="button signup-submit"
                    id="signup-button"
                >
                    Create Account
                </button>


                <!-- MESSAGE -->
                <p id="signup-message"></p>

            </form>


            <!-- LOGIN -->
            <div class="login-link">

                Already have an account?

                <a href="#">
                    Log in
                </a>

            </div>

        </div>

    </main>


    <!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ppsuunamsabnepjlcfyz.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_QQWUTJgcwFks0Pp8Ox6NNw_DM9BFeet";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================
   FORM ELEMENTS
========================================= */

const form =
    document.getElementById("signup-form");

const message =
    document.getElementById("signup-message");

const signupButton =
    document.getElementById("signup-button");


/* =========================================
   SIGN UP
========================================= */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* Get values */

        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const nickname =
            document
                .getElementById("nickname")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const country =
            document
                .getElementById("country")
                .value
                .trim();


        /* Validate */

        if (
            !username ||
            !nickname ||
            !email ||
            !password
        ) {

            message.textContent =
                "Please fill in all required fields.";

            return;
        }


        /* Disable button */

        signupButton.disabled = true;

        signupButton.textContent =
            "Creating Account...";

        message.textContent =
            "Creating your account...";


        /* =========================================
           CREATE AUTH ACCOUNT
        ========================================= */

        const {
            data,
            error
        } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        username: username,

                        nickname: nickname,

                        phone: phone,

                        country: country

                    }

                }

            });


        /* =========================================
           AUTH ERROR
        ========================================= */

        if (error) {

            console.error(
                "Signup error:",
                error
            );

            message.textContent =
                "Error: " +
                error.message;

            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

            return;
        }


        /* =========================================
           AUTH USER CREATED
        ========================================= */

        if (!data || !data.user) {

            message.textContent =
                "Account could not be created.";

            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

            return;
        }


        const userId =
            data.user.id;


        console.log(
            "Auth user created:",
            userId
        );


        /* =========================================
           CREATE PROFILE
        ========================================= */

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id: userId,

                    username: username,

                    nickname: nickname,

                    phone: phone,

                    country: country

                })
                .select()
                .single();


        /* =========================================
           PROFILE ERROR
        ========================================= */

        if (profileError) {

            console.error(
                "Profile creation error:",
                profileError
            );


            message.textContent =
                "Account created, but profile could not be saved: " +
                profileError.message;


            signupButton.disabled = false;

            signupButton.textContent =
                "Create Account";

            return;
        }


        console.log(
            "Profile created:",
            profile
        );


        /* =========================================
           SUCCESS
        ========================================= */

        if (data.session) {

            message.textContent =
                "Account created successfully! 🎉";

        } else {

            message.textContent =
                "Account created! 🎉 Please check your email to verify your account.";

        }


        form.reset();


        signupButton.disabled = false;

        signupButton.textContent =
            "Create Account";

    }
);

</script>
