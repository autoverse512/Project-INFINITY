    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================
           SUPABASE CONFIGURATION
        ========================================= */

        const SUPABASE_URL =
            "https://ppsuunamsabnepjlcfyz.supabase.co";

        const SUPABASE_ANON_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwc3V1bmFtc2FibmVwamxjZnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NTk1NzgsImV4cCI6MjEwNDUzNTU3OH0.iua178hKtB6K7UbLFr1m2-SEpF9X7l8SErlULqOxHB0";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =========================================
           LOAD ACCOUNT
        ========================================= */

        async function loadAccount() {

            const message =
                document.getElementById("account-message");

            message.textContent =
                "Loading account...";


            try {

                /* Get current session */

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                console.log(
                    "Supabase session:",
                    sessionData
                );


                /* Session error */

                if (sessionError) {

                    console.error(
                        "Session error:",
                        sessionError
                    );

                    message.textContent =
                        "Session error: " +
                        sessionError.message;

                    return;
                }


                /* No logged-in user */

                const session =
                    sessionData.session;


                if (!session) {

                    message.textContent =
                        "You are not logged in.";


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1200);


                    return;
                }


                /* Current user */

                const user =
                    session.user;


                console.log(
                    "Logged in user:",
                    user
                );


                /* =========================================
                   GET PROFILE
                ========================================= */

                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select(
                            "username, nickname, phone, country"
                        )
                        .eq("id", user.id)
                        .maybeSingle();


                console.log(
                    "Profile result:",
                    profile,
                    profileError
                );


                /* =========================================
                   PROFILE ERROR
                ========================================= */

                if (profileError) {

                    console.error(
                        "Profile error:",
                        profileError
                    );

                    message.textContent =
                        "Could not load your profile: " +
                        profileError.message;

                    return;
                }


                /* =========================================
                   PROFILE DOES NOT EXIST
                ========================================= */

                if (!profile) {

                    console.warn(
                        "No profile found for user:",
                        user.id
                    );


                    /*
                       Use Auth metadata as a fallback.
                       This allows the account page to still
                       display information for older accounts
                       that were created before the profiles
                       table was connected.
                    */

                    const metadata =
                        user.user_metadata || {};


                    const username =
                        metadata.username ||
                        "Not provided";


                    const nickname =
                        metadata.nickname ||
                        "Not provided";


                    const phone =
                        metadata.phone ||
                        "Not provided";


                    const country =
                        metadata.country ||
                        "Not provided";


                    displayAccount(
                        user,
                        username,
                        nickname,
                        phone,
                        country
                    );


                    message.textContent =
                        "Profile database entry not found. Showing your saved account information.";


                    return;
                }


                /* =========================================
                   PROFILE EXISTS
                ========================================= */

                const username =
                    profile.username ||
                    "Not provided";


                const nickname =
                    profile.nickname ||
                    "Not provided";


                const phone =
                    profile.phone ||
                    "Not provided";


                const country =
                    profile.country ||
                    "Not provided";


                displayAccount(
                    user,
                    username,
                    nickname,
                    phone,
                    country
                );


                message.textContent = "";


                console.log(
                    "Infinity account loaded successfully."
                );

            }


            catch (error) {

                console.error(
                    "Account error:",
                    error
                );

                message.textContent =
                    "Error: " +
                    error.message;

            }

        }


        /* =========================================
           DISPLAY ACCOUNT
        ========================================= */

        function displayAccount(
            user,
            username,
            nickname,
            phone,
            country
        ) {

            /* Email */

            document.getElementById(
                "email"
            ).textContent =
                user.email ||
                "Not available";


            document.getElementById(
                "account-email"
            ).textContent =
                user.email ||
                "";


            /* Username */

            document.getElementById(
                "username"
            ).textContent =
                username;


            /* Nickname */

            document.getElementById(
                "nickname"
            ).textContent =
                nickname;


            /* Phone */

            document.getElementById(
                "phone"
            ).textContent =
                phone;


            /* Country */

            document.getElementById(
                "country"
            ).textContent =
                country;


            /* =========================================
               ACCOUNT ICON
            ========================================= */

            let displayName =
                username;


            if (
                displayName === "Not provided"
            ) {

                displayName =
                    nickname;

            }


            if (
                displayName === "Not provided"
            ) {

                displayName =
                    user.email ||
                    "U";

            }


            document.getElementById(
                "account-icon"
            ).textContent =
                displayName
                    .charAt(0)
                    .toUpperCase();

        }


        /* =========================================
           LOGOUT
        ========================================= */

        document
            .getElementById("logout-button")
            .addEventListener(
                "click",
                async function () {

                    const button =
                        document.getElementById(
                            "logout-button"
                        );


                    button.disabled = true;

                    button.textContent =
                        "Logging out...";


                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signOut();


                    if (error) {

                        console.error(
                            "Logout error:",
                            error
                        );


                        document
                            .getElementById(
                                "account-message"
                            )
                            .textContent =
                            error.message;


                        button.disabled = false;

                        button.textContent =
                            "Log Out";

                        return;
                    }


                    window.location.href =
                        "index.html";

                }
            );


        /* =========================================
           PASSWORD BUTTON
        ========================================= */

        document
            .getElementById("show-password")
            .addEventListener(
                "click",
                function () {

                    alert(
                        "For your security, Infinity cannot display your actual password."
                    );

                }
            );


        /* =========================================
           START
        ========================================= */

        loadAccount();

    </script>
