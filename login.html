<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In — Infinity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        ∞ INFINITY
    </a>

    <a href="signup.html" class="nav-signup">
        Sign Up
    </a>

</nav>


<main class="account-page">

    <div class="account-container">

        <div class="account-header">

            <div class="large-account-icon">
                ∞
            </div>

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>Log In</h1>

            <p>
                Continue creating with Infinity.
            </p>

        </div>


        <form id="login-form">

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>


            <button
                type="submit"
                class="button create-button login-button"
            >
                Log In
            </button>

        </form>


        <div
            id="login-message"
            class="password-message"
        ></div>


        <p class="login-bottom">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ppsuunamsabnepjlcfyz.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_QQWUTJgcwFks0Pp8Ox6NNw_DM9BFeet";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


const form = document.getElementById("login-form");
const message = document.getElementById("login-message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    message.textContent = "Logging in...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        message.textContent = error.message;

        return;
    }


    if (data.session) {

        message.textContent =
            "Login successful!";

        setTimeout(function() {

            window.location.href = "index.html";

        }, 500);

    }

});

</script>

</body>
</html>
